name: Setting up PR's by branch

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pr-auto-assign:
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels and assignees
        uses: actions/github-script@v7
        with:
          script: |
            if (context.payload.pull_request.head.repo.fork) {
              core.info("Skipping PR from fork");
              return;
            }

            const branch = context.payload.pull_request.head.ref;
            const rules = {
              'feature/': { labels: ['feature'], assignees: ['wengwalker'] },
              'bugfix/':  { labels: ['bugfix'],  assignees: ['wengwalker'] }
            };

            let config = null;
            for (const [prefix, cfg] of Object.entries(rules)) {
              if (branch.startsWith(prefix)) {
                config = cfg;
                break;
              }
            }

            if (!config) {
              console.log('Правило для ветки не найдено:', branch);
              return;
            }

            const prNumber = context.payload.pull_request.number;

            await github.rest.issues.addLabels({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: config.labels
            });

            await github.rest.issues.addAssignees({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              assignees: config.assignees
            });

            core.info(`Применено: [${config.labels.join(', ')}] → [${config.assignees.join(', ')}]`);